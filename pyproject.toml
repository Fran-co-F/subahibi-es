[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subahibi-es"
version = "0.1.0"
description = "Herramientas de traducción de novelas visuales (motores como plugins; hoy: Ethornell/BGI, Subarashiki Hibi 15th Anniversary)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = ["Pillow>=10", "tomli>=1.1; python_version < '3.11'"]

[project.optional-dependencies]
texto = ["openpyxl>=3.1"]
po = ["polib>=1.2"]
dev = ["pytest", "polib>=1.2"]

[project.scripts]
subahibi-es = "subahibi_es.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["juegos/*.toml"]          # perfiles de juego incluidos en cada motor

