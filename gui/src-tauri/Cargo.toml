[package]
name = "tl-organizer"
version = "0.1.0"
description = "tl-organizer: organizar la traducción de novelas visuales"
license = "GPL-3.0-or-later"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }

[profile.release]
strip = true
lto = true
